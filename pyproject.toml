[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facecomp"
version = "0.1.0"
description = "Fusion & compression of face-recognition embeddings; 1:N rate-distortion study"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7"]
extract = ["opencv-python>=4.6", "insightface==0.7.3", "onnxruntime>=1.16", "torch>=2.2", "torchvision"]

[tool.setuptools.packages.find]
where = ["src"]
